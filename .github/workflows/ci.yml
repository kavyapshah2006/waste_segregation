name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Action versions run on Node 24 (GitHub is retiring Node 20 for actions). setup-uv has no
  # floating major tag from v10 on, so it is pinned to a release.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync environment (locked)
        # finetune: transformers/peft, so the LoRA weight-conversion tests run here too
        run: uv sync --locked --group finetune

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  kotlin-core:
    # The Kotlin port must reproduce the Python pipeline on every golden fixture.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Kotlin core tests (builds kb.sqlite with uv first)
        working-directory: android
        run: ./gradlew --console=plain :core:test

  android-app:
    # Builds the APK (debug) and uploads it. The runner image has the Android SDK; AGP fetches
    # the platform it needs. Model files are not in git, so this APK has the KB but no detector:
    # release APKs are built locally after export (scripts/build_release.sh).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --console=plain :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
